name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.9"
            gitleaks: linux_x64
            sha: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          - os: ubuntu-latest
            python: "3.13"
            gitleaks: linux_x64
            sha: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          - os: macos-latest
            python: "3.13"
            gitleaks: darwin_arm64
            sha: b40ab0ae55c505963e365f271a8d3846efbc170aa17f2607f13df610a9aeb6a5
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install gitleaks 8.30.1
        run: |
          curl -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_${{ matrix.gitleaks }}.tar.gz"
          echo "${{ matrix.sha }}  gitleaks.tar.gz" > gitleaks.sha256
          shasum -a 256 -c gitleaks.sha256
          tar -xzf gitleaks.tar.gz gitleaks
          mkdir -p "$HOME/bin" && mv gitleaks "$HOME/bin/gitleaks"
          echo "$HOME/bin" >> "$GITHUB_PATH"
          rm -f gitleaks.tar.gz gitleaks.sha256
      - name: Tests
        run: python3 -B -m unittest discover -s tests -q
      - name: Canary
        run: python3 -B tests/canary.py
      - name: This repository's own checks
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        env:
          COMMIT_CHECKS_PRIVATE_NAMES: ${{ secrets.COMMIT_CHECKS_PRIVATE_NAMES }}
          GITHUB_TOKEN: ${{ github.token }}
        run: PYTHONPATH=. python3 -B -m commit_checks ci
